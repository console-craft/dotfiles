#############################################
# Installation                              #
#############################################

# brew install --cask nikitabobko/tap/aerospace
# brew tap FelixKratz/formulae
# brew install sketchybar borders

#############################################
# General Settings & UI                     #
#############################################

config-version = 2
start-at-login = true
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/sketchybar',
  'exec-and-forget /opt/homebrew/bin/borders active_color=0xff7daea3 width=4.0',
]
persistent-workspaces = ["A", "S", "D", "F", "1", "2", "3", "4"]
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]
default-root-container-layout = 'tiles' # tiles|accordion
default-root-container-orientation = 'auto' # horizontal|vertical|auto
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
automatically-unhide-macos-hidden-apps = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']
on-mode-changed = []
accordion-padding = 30

[gaps]
outer.top = 5
outer.right = 5
outer.bottom = 5
outer.left = 5
inner.horizontal = 10
inner.vertical = 10

[key-mapping]
preset = 'qwerty' # qwerty|dvorak|colemak

#############################################
# Window Rules                              #
#############################################

# NOTE: Use `aerospace --list-apps` to get app ids

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace S']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.granola.app'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macsys'
run = ['move-node-to-workspace 1']


# Main mode

[mode.main.binding]
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# Run apps

cmd-alt-t = 'exec-and-forget ~/.config/aerospace/scripts/open-wezterm.sh'

# Windows and workspaces

#############################################
# Windows                                   #
#############################################

# Focus
cmd-alt-h = 'focus left'
cmd-alt-j = 'focus down'
cmd-alt-k = 'focus up'
cmd-alt-l = 'focus right'

# Join (Aerospace only, use cmd+alt+g to change orientation in GlazeWM)
cmd-alt-shift-left = 'join-with left'
cmd-alt-shift-down = 'join-with down'
cmd-alt-shift-up = 'join-with up'
cmd-alt-shift-right = 'join-with right'

# Swap
cmd-alt-shift-h = 'move left'
cmd-alt-shift-j = 'move down'
cmd-alt-shift-k = 'move up'
cmd-alt-shift-l = 'move right'

# Direct resize
cmd-alt-left = 'resize width -50'
cmd-alt-right = 'resize width +50'
cmd-alt-down = 'resize height -50'
cmd-alt-up = 'resize height +50'

# Alternative 'resize' mode
cmd-alt-r = 'mode resize'

#############################################
# Workspaces                                #
#############################################

# Focus
cmd-alt-a = 'workspace A'
cmd-alt-s = 'workspace S'
cmd-alt-d = 'workspace D'
cmd-alt-f = 'workspace F'
cmd-alt-1 = 'workspace 1'
cmd-alt-2 = 'workspace 2'
cmd-alt-3 = 'workspace 3'
cmd-alt-4 = 'workspace 4'

# Send to workspace
cmd-alt-shift-a = ['move-node-to-workspace A', 'workspace A']
cmd-alt-shift-s = ['move-node-to-workspace S', 'workspace S']
cmd-alt-shift-d = ['move-node-to-workspace D', 'workspace D']
cmd-alt-shift-f = ['move-node-to-workspace F', 'workspace F']
cmd-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']

#############################################
# Layouts                                   #
#############################################

cmd-alt-q = 'close'
cmd-alt-enter = 'fullscreen'
cmd-alt-m = 'macos-native-minimize'
cmd-alt-x = 'mode swap'
cmd-alt-v = 'layout floating tiling'     # Also breaks out of layout
cmd-alt-o = 'layout horizontal vertical'
cmd-alt-shift-r = 'reload-config'

# GlazeWM doesn't currently have an accordion option (yet), commenting these for consistency
# cmd-alt-g = 'layout accordion horizontal vertical'
# cmd-alt-shift-g = 'layout tiles horizontal vertical'

#############################################
# Modes                                     #
#############################################

# Resize mode
[mode.resize.binding]
left = 'resize width -50'
right = 'resize width +50'
down = 'resize height -50'
up = 'resize height +50'
esc = 'mode main'

# Swap mode
[mode.swap.binding]
h = ['move left', 'mode main']
j = ['move down', 'mode main']
k = ['move up', 'mode main']
l = ['move right', 'mode main']
