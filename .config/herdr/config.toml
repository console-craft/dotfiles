onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
accent = "#7daea3"      # Primary highlights and active borders
panel_bg = "#33302e"    # Floating panels, overlays, and modals
surface0 = "#3b3634"    # Selected and focused item backgrounds
surface1 = "#4c4641"    # Hovered and active item backgrounds
surface_dim = "#4c4641" # Dim surfaces and separators
overlay0 = "#695e55"    # Muted text, secondary details, and numbers
overlay1 = "#8b7d71"    # Brighter secondary text
text = "#d4be98"        # Main text
subtext0 = "#8b7d71"    # Subdued labels and workspace numbers
mauve = "#d4a599"       # Branch names and special labels
green = "#bac584"       # Done and idle states
yellow = "#d6b37b"      # Working and running states
red = "#de9880"         # Blocked states and items needing attention
blue = "#adb79d"        # Unseen and completed notifications
teal = "#b2ba8e"        # Notification accents and unseen markers
peach = "#eead83"       # Interrupted states and warnings

[ui]
right_click_passthrough_modifier = "ctrl"
prompt_new_tab_name = false
# hide_tab_bar_when_single_tab = true
# agent_panel_sort = "spaces"
# sidebar_collapsed_mode = "hidden"
# pane_gaps = false

[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true
pane_history = true

[keys]

# General

prefix = "ctrl+space"
toggle_sidebar = "prefix+b"
goto = "prefix+f"
open_notification_target = "prefix+o" # what is this for?
remote_image_paste = "ctrl+v"
copy_mode = "prefix+y"
reload_config = "prefix+shift+r"
detach = "prefix+shift+q"

# Workspaces

new_workspace = "prefix+w"
close_workspace = "prefix+d"
previous_workspace = "ctrl+alt+cmd+k"
next_workspace = "ctrl+alt+cmd+j"

# Worktrees / Worktrunks

# Disabling default herdr worktree keymaps in favour of using the herdr-worktrunk plugin
# Use prefix+g (create or switch) and prefix+r (remove) instead
new_worktree = ""
open_worktree = ""
remove_worktree = ""

# Agents

previous_agent = "ctrl+alt+cmd+h"
next_agent = "ctrl+alt+cmd+l"

# Tabs

new_tab = "prefix+n"
previous_tab = "ctrl+alt+cmd+["
next_tab = "ctrl+alt+cmd+]"
close_tab = "prefix+c"

# Panes

split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+q"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
zoom = "ctrl+alt+cmd+enter"

# Open Neovim in a new pane

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "$HOME/.config/herdr/scripts/open-nvim-pane"
description = "open Neovim in a pane to the right"

# Open Hunk in a new pane

[[keys.command]]
key = "prefix+h"
type = "shell"
command = "$HOME/.config/herdr/scripts/open-hunk-pane"
description = "open Hunk in a pane to the right"

# Resize panes directly

[[keys.command]]
key = "prefix+left"
type = "shell"
command = "herdr pane resize --current --direction left"
description = "resize pane left"

[[keys.command]]
key = "prefix+down"
type = "shell"
command = "herdr pane resize --current --direction down"
description = "resize pane down"

[[keys.command]]
key = "prefix+up"
type = "shell"
command = "herdr pane resize --current --direction up"
description = "resize pane up"

[[keys.command]]
key = "prefix+right"
type = "shell"
command = "herdr pane resize --current --direction right"
description = "resize pane right"

# Worktrunk plugin

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

# Pane navigation

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

### Re-arrange tabs

[[keys.command]]
key = "prefix+{"
type = "shell"
command = "$HOME/.config/herdr/scripts/move-tab left"
description = "move active tab left"

[[keys.command]]
key = "prefix+}"
type = "shell"
command = "$HOME/.config/herdr/scripts/move-tab right"
description = "move active tab right"

### Break pane into new tab

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "$HOME/.config/herdr/scripts/break-pane-into-new-tab"
description = "move focused pane into a new tab"

### Move pane to tab

