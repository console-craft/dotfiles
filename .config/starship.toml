"$schema" = "https://starship.rs/config-schema.json"

palette = "gruvbox_dark"

# A simple, stable "status bar" on line 1, prompt char on line 2.
format = """
[$os](bg:color_bg3 fg:color_blue)\
[$username](bg:color_bg3 fg:color_fg0)\
[$directory](bg:color_bg3 fg:color_fg0)\
$git_branch$git_status\
$nodejs$rust$golang$python$java$php\
$line_break$character
"""

scan_timeout = 500

# Optional: makes long commands still readable if you ever add right_format later
add_newline = true

[palettes.gruvbox_dark]
color_fg0 = "#fbf1c7"
color_bg1 = "#32302f"
color_bg3 = "#3c3836"
color_blue = "#7daea3"
color_aqua = "#89b482"
color_green = "#a9b665"
color_orange = "#e78a4e"
color_purple = "#d3869b"
color_red = "#ea6962"
color_yellow = "#d8a657"

# --- Left side modules --------------------------------------------------------

[os]
disabled = false
style = "bg:color_bg3 fg:color_blue"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_bg3 fg:color_fg0"
style_root = "bg:color_bg3 fg:color_red"
format = "[ $user ]($style)"

[directory]
style = "bg:color_bg3 fg:color_fg0"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# --- Git (adds stable separators using plain glyphs) --------------------------

[git_branch]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $branch ]($style)"

[git_status]
style = "bg:color_bg3 fg:color_fg0"
format = "[ $all_status$ahead_behind ]($style)"

# --- Languages (only show when relevant; compact; stable separators) ----------

[nodejs]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

[python]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

[java]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

[php]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = "[ | $symbol $version ]($style)"

# --- Prompt line --------------------------------------------------------------

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:color_green)"
error_symbol = "[](bold fg:color_red)"
vimcmd_symbol = "[](bold fg:color_green)"
vimcmd_replace_one_symbol = "[](bold fg:color_purple)"
vimcmd_replace_symbol = "[](bold fg:color_purple)"
vimcmd_visual_symbol = "[](bold fg:color_yellow)"
