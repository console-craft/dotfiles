[custom_theme.syntax]
# Hunk 0.17.6 uses these semantic roles; newer builds prefer syntax_scopes below.
default = "#d4be98"
keyword = "#d4be98"
string = "#bac584"
comment = "#8b7d71"
number = "#de9880"
function = "#adb79d"
property = "#d4be98"
type = "#e6d5ae"
variable = "#d6b37b"
operator = "#d4be98"
punctuation = "#ca9a70"

