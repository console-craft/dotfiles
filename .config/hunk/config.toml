theme = "custom"
mode = "split"
vcs = "git"
watch = true
exclude_untracked = false
line_numbers = true
wrap_lines = false
menu_bar = true
agent_notes = true
prompt_save_view_preferences = true
hunk_headers = false
color_moved = true
transparent_background = false

[custom_theme]
base = "gruvbox-dark-soft"
label = "Gruvcraft"
background = "#33302e"
panel = "#3b3634"
panelAlt = "#3b3634"
border = "#adb79d"
accent = "#adb79d"
